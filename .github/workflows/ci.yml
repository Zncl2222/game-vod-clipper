name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.9"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --frozen --all-extras
      - run: npm --prefix web ci
      - name: Ruff
        run: uv run --frozen ruff check src tests scripts web/tests --output-format github
      - name: Biome
        run: npm --prefix web run lint
      - name: TypeScript
        run: npm --prefix web run typecheck
      - name: Production build
        run: npm --prefix web run build

  python:
    name: Python ${{ matrix.python }} tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.9"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install trusted media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --frozen --all-extras
      - name: Unit and media integration tests
        run: uv run --frozen python -m unittest discover -s tests -v

  browser:
    name: Browser tests (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [chat, youtube, e2e, storage]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.9"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install trusted media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --frozen --all-extras
      - run: npm --prefix web ci
      - name: Install Chromium and system dependencies
        working-directory: web
        run: npx --no-install playwright install --with-deps chromium
      - run: npm --prefix web run build
      - name: Run browser suite
        run: npm --prefix web run test:${{ matrix.suite }} -- --reporter=line,html
      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ matrix.suite }}
          path: |
            web/playwright-report/
            runs/*-ui-tests/
          if-no-files-found: ignore
          retention-days: 7
